name: 构建 RPK

on:
  push:
    branches:
      - main
      - master
      - Next-main
      - "next-gen**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
      - master
      - Next-main
  workflow_dispatch:
    inputs:
      upload_release:
        description: 是否上传到 Release
        required: true
        type: boolean
        default: true
      prerelease:
        description: 是否为预发布
        required: true
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 Yarn 1.x
        run: |
          npm install -g yarn@1.22.22
          yarn --version

      - name: 安装依赖
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: 构建 RPK（RedmiWatch5_6）
        run: yarn build

      - name: 命名构建产物
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src/manifest.json').versionName.replace(/ /g, '_')")
          COMMIT_SHA="${GITHUB_SHA::7}"
          RPK_PATH=$(find dist -name "*.rpk" | head -n 1)
          if [ -z "$RPK_PATH" ]; then
            echo "未在 dist 中找到 RPK 产物"
            exit 1
          fi
          RPK_NAME="hyperbilibili-RedmiWatch5_6-v${VERSION}-${COMMIT_SHA}.rpk"
          cp "$RPK_PATH" "$RPK_NAME"
          {
            echo "rpk_path=$RPK_NAME"
            echo "version=$VERSION"
            echo "short_sha=$COMMIT_SHA"
          } >> "$GITHUB_OUTPUT"
          ls -lh "$RPK_NAME"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: rpk-RedmiWatch5_6
          path: ${{ steps.artifact.outputs.rpk_path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: 发布到 Release
        if: github.event_name != 'pull_request' && github.event.inputs.upload_release != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vRedmiWatch5_6-v${{ steps.artifact.outputs.version }}-${{ steps.artifact.outputs.short_sha }}
          name: RedmiWatch5_6 v${{ steps.artifact.outputs.version }}（${{ steps.artifact.outputs.short_sha }}）
          body: |
            设备: RedmiWatch5_6
            版本: v${{ steps.artifact.outputs.version }}
            提交: ${{ github.sha }}
            预发布: ${{ github.event.inputs.prerelease != 'false' }}
            触发: ${{ github.event_name }}
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}
          make_latest: ${{ github.event.inputs.prerelease == 'false' }}
          files: ${{ steps.artifact.outputs.rpk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-RedmiWatch5_6
          path: |
            dist/
          retention-days: 7
          if-no-files-found: ignore
