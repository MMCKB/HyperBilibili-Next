<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页布局编辑器 · 澎湃哔哩</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0c0c0f; color: #e8e8ee; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .app-header {
    height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px;
    border-bottom: 1px solid #22222a; background: #101014;
  }
  .app-header .mark { width: 8px; height: 22px; border-radius: 4px; background: #ff7da8; }
  .app-header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
  .app-header .sub { font-size: 12px; color: #8a8a96; }
  .app-header .spacer { flex: 1; }
  .app-header .hint-badge {
    font-size: 11px; color: #ffb3cb; border: 1px solid #4a2a36; background: #1e1218;
    padding: 4px 8px; border-radius: 999px; white-space: nowrap;
  }

  .main { display: flex; height: calc(100% - 56px); }

  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; background: radial-gradient(900px 500px at 50% 0%, #1a1a22 0%, #0c0c0f 70%); }
  .stage-toolbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 20px; border-bottom: 1px solid #1b1b22;
  }
  .zoom-group { display: flex; background: #16161c; border: 1px solid #262630; border-radius: 8px; overflow: hidden; }
  .zoom-group button {
    background: transparent; border: 0; color: #b9b9c6; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .zoom-group button.active { background: #ff7da8; color: #141418; font-weight: 700; }
  .stage-toolbar label { font-size: 12px; color: #b7b7c4; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .stage-toolbar input[type="checkbox"] { accent-color: #ff7da8; }
  .stage-toolbar input[type="range"] { width: 110px; accent-color: #ff7da8; }
  .stage-toolbar .sep { width: 1px; height: 18px; background: #262630; }
  .stage-body { flex: 1; display: flex; overflow: auto; padding: 24px; }
  .stage-foot { padding: 0 20px 12px; color: #6f6f7c; font-size: 11px; text-align: center; }

  .watch-wrap { position: relative; margin: auto; width: calc(432px * var(--zoom)); height: calc(526px * var(--zoom)); flex: 0 0 auto; }
  .watch {
    position: absolute; left: 0; top: 0; width: 432px; height: 526px;
    background: #000; border-radius: 40px; overflow: hidden;
    transform: scale(var(--zoom)); transform-origin: top left;
    box-shadow: 0 0 0 7px #191920, 0 0 0 9px #2a2a33, 0 24px 60px rgba(0,0,0,.65);
  }
  .screen { position: absolute; inset: 0; background: #000; }
  .bg-img { position: absolute; left: 0; top: 0; width: 432px; height: 480px; object-fit: cover; pointer-events: none; }
  .content { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 70px; }
  .content::-webkit-scrollbar { width: 0; }

  .switch-bar { position: relative; height: 57px; }
  .bar-left { position: absolute; left: 57px; display: flex; align-items: center; white-space: nowrap; }
  .switch-icon { width: 32px; height: 32px; object-fit: contain; display: block; }
  .page-title { color: #fff; font-weight: 600; margin-left: 9px; white-space: nowrap; cursor: pointer; }
  .top-right { position: absolute; right: 57px; display: flex; align-items: center; gap: 6px; }
  .clock { color: #fff; font-weight: 600; white-space: nowrap; cursor: default; }

  .pill {
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.28); cursor: pointer; overflow: visible; flex: 0 0 auto;
  }
  .pill-inner { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; height: 100%; overflow: hidden; }
  .ring-wrap { position: relative; width: 18px; height: 18px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
  .ring { position: absolute; left: 0; top: 0; width: 18px; height: 18px; }
  .dl-icon { position: relative; width: 9px; height: 9px; object-fit: contain; opacity: .95; }
  .pill-pct { font-size: 14px; font-weight: 600; color: #fff; line-height: 1; white-space: nowrap; }

  .tip { text-align: center; font-weight: 600; color: #fff; cursor: pointer; padding: 0 10px; }
  .cards { display: flex; flex-direction: column; align-items: center; margin-top: 15px; }

  .card {
    background: rgba(38,38,38,.686); display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
  }
  .cover-wrap {
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: linear-gradient(135deg, #4a3d4b 0%, #2a2a34 55%, #23202a 100%);
    cursor: pointer; flex: 0 0 auto;
  }
  .cover-play {
    width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.85); font-size: 15px;
    padding-left: 2px;
  }
  .card-title {
    width: 100%; color: #fff; font-weight: 600; line-height: 1.3; margin-top: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    color: #e4e4ea; margin-top: 5px; gap: 8px;
  }
  .card-meta .up { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
  .views { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .views img { width: 20px; height: 15px; object-fit: contain; display: block; }

  .refresh-btn {
    position: absolute; z-index: 15; object-fit: contain; cursor: grab; user-select: none;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.35));
  }

  .watch { user-select: none; }
  [data-move] { cursor: move; }
  .page-title { cursor: move; }

  .sel { outline: 2px dashed #ff7da8; outline-offset: 2px; }
  .handle {
    position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px;
    background: #ff7da8; border: 2px solid #111; border-radius: 4px; cursor: nwse-resize; z-index: 40;
  }

  .panel { width: 372px; flex: 0 0 372px; border-left: 1px solid #1e1e26; background: #101014; display: flex; flex-direction: column; }
  .panel-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px; border-bottom: 1px solid #1e1e26; }
  .chip {
    border: 1px solid #2a2a34; background: #17171d; color: #b9b9c6; border-radius: 999px;
    padding: 5px 10px; font-size: 11px; cursor: pointer;
  }
  .chip.active { background: #2a1c23; border-color: #ff7da8; color: #ff9dbb; }
  .panel-scroll { flex: 1; overflow-y: auto; padding: 14px; }
  .group { border: 1px solid #22222b; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .group-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; background: #16161c; cursor: pointer; user-select: none;
  }
  .group-head h3 { font-size: 13px; margin: 0; font-weight: 600; }
  .group-head .count { font-size: 10px; color: #7d7d8a; }
  .group-body { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 11px; }
  .group.collapsed .group-body { display: none; }
  .ctrl { display: flex; flex-direction: column; gap: 5px; }
  .ctrl-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: #b7b7c4; }
  .ctrl-top .val { display: flex; align-items: center; gap: 4px; }
  .ctrl-top input[type="number"] {
    width: 62px; background: #0b0b0e; border: 1px solid #2a2a34; color: #fff;
    border-radius: 5px; padding: 3px 6px; font-size: 12px; text-align: right; outline: none;
  }
  .ctrl-top input[type="number"]:focus { border-color: #ff7da8; }
  .ctrl-top .unit { font-size: 10px; color: #6f6f7c; }
  input[type="range"] { width: 100%; accent-color: #ff7da8; height: 16px; }
  .changed-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff7da8; display: none; flex: 0 0 auto; }
  .ctrl.changed .changed-dot { display: block; }

  .export { border-top: 1px solid #1e1e26; background: #0d0d11; padding: 12px 14px 14px; }
  .export-title { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #b7b7c4; margin-bottom: 8px; }
  .export-title .badge { font-size: 10px; color: #ff9dbb; border: 1px solid #4a2a36; background: #1e1218; border-radius: 999px; padding: 2px 7px; }
  .export textarea {
    width: 100%; height: 138px; resize: vertical; background: #09090c; color: #d3d3dc;
    border: 1px solid #262630; border-radius: 8px; padding: 9px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; line-height: 1.5; outline: none;
  }
  .btnrow { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
  button.act { border: 0; border-radius: 7px; padding: 8px 12px; font-size: 12px; cursor: pointer; background: #23232c; color: #e6e6ee; }
  button.act:hover { background: #2c2c37; }
  button.act.primary { background: #ff7da8; color: #15151a; font-weight: 700; }
  button.act.primary:hover { background: #ff92b6; }
  button.act.ghost { background: transparent; border: 1px solid #2c2c36; color: #9c9caa; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
    background: #ff7da8; color: #15151a; font-weight: 700; font-size: 12px;
    padding: 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: all .2s ease; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1200px) {
    .app-header .sub { display: none; }
  }
  @media (max-width: 1080px) {
    .panel { width: 330px; flex-basis: 330px; }
  }
</style>
</head>
<body>
  <header class="app-header">
    <div class="mark"></div>
    <h1>首页布局编辑器</h1>
    <span class="sub">矩形屏 · 设计尺寸 432 × 526 · 改动后复制配置给 AI</span>
    <div class="spacer"></div>
    <span class="hint-badge">点击选中 · 拖动移动 · 右下角手柄缩放</span>
  </header>

  <div class="main">
    <section class="stage">
      <div class="stage-toolbar">
        <div class="zoom-group" id="zoomGroup">
          <button data-zoom="0.8">80%</button>
          <button data-zoom="1" class="active">100%</button>
          <button data-zoom="1.3">130%</button>
          <button data-zoom="1.6">160%</button>
        </div>
        <div class="sep"></div>
        <label><input type="checkbox" id="cacheToggle" checked> 预览缓存中</label>
        <label>进度 <input type="range" id="cachePct" min="0" max="100" value="63"><span id="cachePctVal" style="width:32px;display:inline-block;text-align:right">63%</span></label>
        <div class="sep"></div>
        <label style="cursor:default;color:#6f6f7c">背景图与图标取自项目真实素材</label>
      </div>
      <div class="stage-body">
        <div class="watch-wrap" id="watchWrap" style="--zoom:1">
          <div class="watch">
            <div class="screen">
              <img class="bg-img" id="bgImg" alt="">
              <div class="content" id="content">
                <div class="switch-bar" id="switchBar">
                  <div class="bar-left" id="barLeft" data-move="title">
                    <img class="switch-icon" id="switchIcon" alt="">
                    <span class="page-title" id="pageTitle" data-sel="title">首页</span>
                  </div>
                  <div class="top-right" id="topRight" data-move="topRight">
                    <div class="pill" id="pill" data-sel="pill" data-resize="pill">
                      <div class="pill-inner" id="pillInner">
                        <div class="ring-wrap" id="ringWrap" data-sel="ring">
                          <svg class="ring" id="ringSvg" viewBox="0 0 18 18">
                            <circle id="ringTrack" cx="9" cy="9" r="7" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3"></circle>
                            <circle id="ringArc" cx="9" cy="9" r="7" fill="none" stroke="#ffffff" stroke-width="3"
                              stroke-linecap="round" stroke-dasharray="43.98" stroke-dashoffset="16.3"
                              transform="rotate(-90 9 9)"></circle>
                          </svg>
                          <img class="dl-icon" id="dlIcon" alt="">
                        </div>
                        <span class="pill-pct" id="pillPct" data-sel="pct">63%</span>
                      </div>
                    </div>
                    <span class="clock" id="clock">14:36</span>
                  </div>
                </div>

                <div class="tip" id="tip" data-sel="tip" data-move="tip">今天也要开心看视频呀</div>
                <div class="cards" id="cards" data-move="cards"></div>
              </div>
              <img class="refresh-btn" id="refreshBtn" data-sel="refresh" data-resize="refresh" data-move="refresh" alt="">
            </div>
          </div>
        </div>
      </div>
      <div class="stage-foot">这是按首页真实结构和素材还原的预览，数值单位为设计像素（design px）</div>
    </section>

    <aside class="panel">
      <div class="panel-tools" id="selectChips">
        <button class="chip" data-target="title">标题</button>
        <button class="chip" data-target="pill">胶囊</button>
        <button class="chip" data-target="ring">进度环</button>
        <button class="chip" data-target="pct">百分比</button>
        <button class="chip" data-target="card">视频卡片</button>
        <button class="chip" data-target="cover">封面</button>
        <button class="chip" data-target="tip">提示语</button>
        <button class="chip" data-target="refresh">刷新按钮</button>
      </div>

      <div class="panel-scroll" id="panelScroll"></div>

      <div class="export">
        <div class="export-title">
          <span>改动配置</span>
          <span class="badge" id="changeBadge">0 项修改</span>
        </div>
        <textarea id="exportText" readonly></textarea>
        <div class="btnrow">
          <button class="act primary" id="copyAi">复制给 AI</button>
          <button class="act" id="copyJson">复制 JSON</button>
          <button class="act" id="downloadJson">下载 JSON</button>
          <button class="act ghost" id="resetAll">重置全部</button>
        </div>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

        { k: "refreshH", label: "高度", min: 40, max: 160 },
        { k: "refreshX", label: "水平位置", min: 0, max: 100 },
        { k: "refreshBottom", label: "距底部", min: 0, max: 80 }
      ]
    }
  ];

  var SAMPLE_TITLES = [
    "【4K修复】把旧时光重新调成彩色，这才是记忆该有的样子",
    "一口气看完整个系列的设定，细节比想象中多得多",
    "三分钟看懂这个热门话题的来龙去脉"
  ];
  var SAMPLE_UPS = ["澎湃哔哩官方", "科技观察室", "生活记录员"];
  var SAMPLE_VIEWS = ["12.3万", "8.6万", "3.1万"];

  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var selected = null;
  var currentZoom = 1;

  var el = {
    watchWrap: document.getElementById("watchWrap"),
    bgImg: document.getElementById("bgImg"),
    switchIcon: document.getElementById("switchIcon"),
    barLeft: document.getElementById("barLeft"),
    pageTitle: document.getElementById("pageTitle"),
    topRight: document.getElementById("topRight"),
    pill: document.getElementById("pill"),
    pillInner: document.getElementById("pillInner"),
    ringWrap: document.getElementById("ringWrap"),
    ringSvg: document.getElementById("ringSvg"),
    ringTrack: document.getElementById("ringTrack"),
    ringArc: document.getElementById("ringArc"),
    dlIcon: document.getElementById("dlIcon"),
    pillPct: document.getElementById("pillPct"),
    clock: document.getElementById("clock"),
    tip: document.getElementById("tip"),
    cards: document.getElementById("cards"),
    refreshBtn: document.getElementById("refreshBtn"),
    panelScroll: document.getElementById("panelScroll"),
    exportText: document.getElementById("exportText"),
    changeBadge: document.getElementById("changeBadge"),
    toast: document.getElementById("toast"),
    cacheToggle: document.getElementById("cacheToggle"),
    cachePct: document.getElementById("cachePct"),
    cachePctVal: document.getElementById("cachePctVal")
  };

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function buildAssets() {
    el.bgImg.src = ASSETS.bg;
    el.switchIcon.src = ASSETS.switchIcon;
    el.dlIcon.src = ASSETS.download;
    el.refreshBtn.src = ASSETS.refresh;
  }

  function buildCards() {
    var html = "";
    for (var i = 0; i < 3; i++) {
      html +=
        '<div class="card" data-sel="card" data-resize="card">' +
          '<div class="cover-wrap" data-sel="cover" data-resize="cover">' +
            '<div class="cover-play">▶</div>' +
          '</div>' +
          '<div class="card-title">' + SAMPLE_TITLES[i] + '</div>' +
          '<div class="card-meta">' +
            '<span class="up">UP：' + SAMPLE_UPS[i] + '</span>' +
            '<span class="views"><img src="' + ASSETS.view + '" alt="">' + SAMPLE_VIEWS[i] + '</span>' +
          '</div>' +
        '</div>';
    }
    el.cards.innerHTML = html;
  }

  function buildControls() {
    var html = "";
    SCHEMA.forEach(function (group) {
      html += '<div class="group" data-group="' + group.key + '">' +
        '<div class="group-head"><h3>' + group.title + '</h3><span class="count">' + group.items.length + ' 项</span></div>' +
        '<div class="group-body">';
      group.items.forEach(function (item) {
        html += '<div class="ctrl" data-path="' + group.key + '.' + item.k + '">' +
          '<div class="ctrl-top">' +
            '<span><span class="changed-dot"></span> ' + item.label + '</span>' +
            '<span class="val"><input type="number" min="' + item.min + '" max="' + item.max + '" step="1" data-path="' + group.key + '.' + item.k + '"><span class="unit">px</span></span>' +
          '</div>' +
          '<input type="range" min="' + item.min + '" max="' + item.max + '" step="1" data-path="' + group.key + '.' + item.k + '">' +
        '</div>';
      });
      html += '</div></div>';
    });
    el.panelScroll.innerHTML = html;

    el.panelScroll.querySelectorAll('input[data-path]').forEach(function (input) {
      input.addEventListener("input", function () {
        var path = input.getAttribute("data-path").split(".");
        var group = path[0];
        var key = path[1];
        var min = Number(input.min || 0);
        var max = Number(input.max || 999);
        var val = clamp(Number(input.value) || 0, min, max);
        state[group][key] = val;
        apply();
        syncControls();
        updateExport();
      });
    });

    el.panelScroll.querySelectorAll(".group-head").forEach(function (head) {
      head.addEventListener("click", function () {
        head.parentElement.classList.toggle("collapsed");
      });
    });
  }

  function syncControls() {
    el.panelScroll.querySelectorAll("input[data-path]").forEach(function (input) {
      var path = input.getAttribute("data-path").split(".");
      var val = state[path[0]][path[1]];
      if (document.activeElement !== input) {
        input.value = val;
      }
      var ctrl = input.closest(".ctrl");
      if (ctrl) {
        var changed = val !== DEFAULTS[path[0]][path[1]];
        ctrl.classList.toggle("changed", changed);
      }
    });
  }

  function apply() {
    var v = state.video;
    var t = state.topbar;
    var tip = state.tip;
    var r = state.refresh;

    // 顶栏
    el.barLeft.style.left = t.titleLeft + "px";
    el.barLeft.style.top = t.topMargin + "px";
    el.topRight.style.right = t.topRightRight + "px";
    el.topRight.style.top = t.rightTop + "px";
    el.topRight.style.gap = t.clockGap + "px";
    el.pageTitle.style.fontSize = t.titleSize + "px";
    el.clock.style.fontSize = t.timeSize + "px";
    el.pill.style.width = t.pillW + "px";
    el.pill.style.height = t.pillH + "px";
    el.pill.style.borderRadius = t.pillRadius + "px";

    var showCache = el.cacheToggle.checked;
    var pct = Number(el.cachePct.value) || 0;
    el.pillInner.style.display = showCache ? "flex" : "none";
    el.pillInner.style.gap = t.pillGap + "px";
    el.pillPct.textContent = pct + "%";
    el.pillPct.style.fontSize = t.pctSize + "px";
    el.pillPct.style.width = t.pctWidth + "px";

    // 胶囊内部：进度环 / 图标 / 百分比都可独立调节
    el.ringWrap.style.width = t.ringSize + "px";
    el.ringWrap.style.height = t.ringSize + "px";
    el.ringSvg.setAttribute("viewBox", "0 0 " + t.ringSize + " " + t.ringSize);
    el.ringSvg.style.width = t.ringSize + "px";
    el.ringSvg.style.height = t.ringSize + "px";
    var ringR = Math.max(0.5, (t.ringSize - t.ringStroke) / 2);
    var ringC = t.ringSize / 2;
    [el.ringTrack, el.ringArc].forEach(function (circle) {
      circle.setAttribute("cx", ringC);
      circle.setAttribute("cy", ringC);
      circle.setAttribute("r", ringR);
      circle.setAttribute("stroke-width", t.ringStroke);
      circle.setAttribute("transform", "rotate(-90 " + ringC + " " + ringC + ")");
    });
    el.dlIcon.style.width = t.iconSize + "px";
    el.dlIcon.style.height = t.iconSize + "px";

    var circumference = 2 * Math.PI * ringR;
    el.ringArc.setAttribute("stroke-dasharray", circumference.toFixed(2));
    el.ringArc.setAttribute("stroke-dashoffset", (circumference * (1 - pct / 100)).toFixed(2));

    // 胶囊装不下内容时隐藏内部，避免溢出（调大胶囊或调小内部组件即可恢复）
    var needW = t.ringSize + t.pillGap + t.pctWidth + 2;
    var needH = Math.max(t.ringSize, t.pctSize) + 4;
    if (t.pillW < needW || t.pillH < needH) {
      el.pillInner.style.display = "none";
    }

    // 提示语
    el.tip.style.fontSize = tip.tipSize + "px";
    el.tip.style.marginTop = tip.tipMarginTop + "px";
    el.tip.style.transform = "translateX(" + tip.tipOffsetX + "px)";

    // 卡片组整体位置
    el.cards.style.marginTop = (15 + v.cardsTop) + "px";
    el.cards.style.transform = "translateX(" + v.cardsOffsetX + "px)";

    // 视频卡片
    el.cards.querySelectorAll(".card").forEach(function (card) {
      card.style.width = v.cardWidth + "px";
      card.style.padding = v.cardPadding + "px";
      card.style.borderRadius = v.cardRadius + "px";
      card.style.marginTop = v.cardGap + "px";

      var coverWrap = card.querySelector(".cover-wrap");
      coverWrap.style.width = v.coverW + "px";
      coverWrap.style.height = v.coverH + "px";
      coverWrap.style.borderRadius = v.coverRadius + "px";

      card.querySelector(".card-title").style.fontSize = v.titleSize + "px";
      card.querySelector(".card-meta").style.fontSize = v.metaSize + "px";
    });

    // 刷新按钮
    el.refreshBtn.style.width = r.refreshW + "px";
    el.refreshBtn.style.height = r.refreshH + "px";
    el.refreshBtn.style.left = r.refreshX + "%";
    el.refreshBtn.style.bottom = r.refreshBottom + "px";
    el.refreshBtn.style.transform = "translateX(-50%)";
  }

  // ---------- 选择与缩放 ----------
  function clearSelection() {
    document.querySelectorAll(".sel").forEach(function (n) { n.classList.remove("sel"); });
    document.querySelectorAll(".handle").forEach(function (n) { n.remove(); });
    selected = null;
    updateChips();
  }

  function select(node) {
    clearSelection();
    if (!node) return;
    selected = node;
    node.classList.add("sel");
    updateChips();

    var kind = node.getAttribute("data-resize");
    if (kind) {
      var h = document.createElement("div");
      h.className = "handle";
      h.setAttribute("data-handle", "1");
      h.addEventListener("pointerdown", onResizeStart);
      // 阻止手柄点击冒泡到组件
      h.addEventListener("click", function (e) { e.stopPropagation(); });
      node.appendChild(h);
    }
  }

  function updateChips() {
    var activeKey = null;
    if (selected) {
      if (selected === el.pageTitle) activeKey = "title";
      else if (selected === el.pill) activeKey = "pill";
      else if (selected === el.ringWrap) activeKey = "ring";
      else if (selected === el.pillPct) activeKey = "pct";
      else if (selected === el.tip) activeKey = "tip";
      else if (selected === el.refreshBtn) activeKey = "refresh";
      else if (selected.classList.contains("cover-wrap")) activeKey = "cover";
      else if (selected.classList.contains("card")) activeKey = "card";
    }
    document.querySelectorAll("#selectChips .chip").forEach(function (chip) {
      chip.classList.toggle("active", chip.getAttribute("data-target") === activeKey);
    });
  }

  function findTarget(name) {
    if (name === "title") return el.pageTitle;
    if (name === "pill") return el.pill;
    if (name === "ring") return el.ringWrap;
    if (name === "pct") return el.pillPct;
    if (name === "tip") return el.tip;
    if (name === "refresh") return el.refreshBtn;
    if (name === "card") return el.cards.querySelector(".card");
    if (name === "cover") return el.cards.querySelector(".cover-wrap");
    return null;
  }

  function onResizeStart(ev) {
    if (!selected) return;
    ev.preventDefault();
    ev.stopPropagation();

    var kind = selected.getAttribute("data-resize");
    var startX = ev.clientX;
    var startY = ev.clientY;
    var init = JSON.parse(JSON.stringify(state));

    function onMove(e) {
      var dx = (e.clientX - startX) / currentZoom;
      var dy = (e.clientY - startY) / currentZoom;

      if (kind === "cover") {
        state.video.coverW = Math.round(clamp(init.video.coverW + dx, 140, 360));
        state.video.coverH = Math.round(clamp(init.video.coverH + dy, 80, 260));
      } else if (kind === "card") {
        state.video.cardWidth = Math.round(clamp(init.video.cardWidth + dx, 180, 380));
      } else if (kind === "pill") {
        state.topbar.pillW = Math.round(clamp(init.topbar.pillW + dx, 40, 160));
        state.topbar.pillH = Math.round(clamp(init.topbar.pillH + dy, 18, 40));
      } else if (kind === "refresh") {
        state.refresh.refreshW = Math.round(clamp(init.refresh.refreshW + dx, 40, 160));
        state.refresh.refreshH = Math.round(clamp(init.refresh.refreshH + dy, 40, 160));
      } else {
        return;
      }
      apply();
      syncControls();
      updateExport();
    }

    function onUp() {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    }

    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }

  // ---------- 拖动组件位置 ----------
  var dragState = null;
  var suppressClick = false;

  document.querySelector(".watch").addEventListener("pointerdown", function (e) {
    if (e.target.closest("[data-handle]")) return;
    var moveEl = e.target.closest("[data-move]");
    if (!moveEl) return;
    dragState = {
      kind: moveEl.getAttribute("data-move"),
      startX: e.clientX,
      startY: e.clientY,
      init: JSON.parse(JSON.stringify(state)),
      moved: false
    };
  });

  window.addEventListener("pointermove", function (e) {
    if (!dragState) return;
    var dx = (e.clientX - dragState.startX) / currentZoom;
    var dy = (e.clientY - dragState.startY) / currentZoom;
    if (!dragState.moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
    dragState.moved = true;
    suppressClick = true;
    var init = dragState.init;

    if (dragState.kind === "title") {
      state.topbar.titleLeft = Math.round(clamp(init.topbar.titleLeft + dx, 0, 160));
      state.topbar.topMargin = Math.round(clamp(init.topbar.topMargin + dy, 0, 30));
    } else if (dragState.kind === "topRight") {
      state.topbar.topRightRight = Math.round(clamp(init.topbar.topRightRight - dx, 0, 160));
      state.topbar.rightTop = Math.round(clamp(init.topbar.rightTop + dy, 0, 30));
    } else if (dragState.kind === "tip") {
      state.tip.tipOffsetX = Math.round(clamp(init.tip.tipOffsetX + dx, -120, 120));
      state.tip.tipMarginTop = Math.round(clamp(init.tip.tipMarginTop + dy, 0, 60));
    } else if (dragState.kind === "cards") {
      state.video.cardsOffsetX = Math.round(clamp(init.video.cardsOffsetX + dx, -120, 120));
      state.video.cardsTop = Math.round(clamp(init.video.cardsTop + dy, 0, 80));
    } else if (dragState.kind === "refresh") {
      state.refresh.refreshX = Math.round(clamp(init.refresh.refreshX + (dx / 432) * 100, 0, 100));
      state.refresh.refreshBottom = Math.round(clamp(init.refresh.refreshBottom - dy, 0, 80));
    } else {
      return;
    }
    apply();
    syncControls();
    updateExport();
  });

  window.addEventListener("pointerup", function () {
    if (dragState && dragState.moved) {
      setTimeout(function () { suppressClick = false; }, 250);
    }
    dragState = null;
  });

  // 点击选中
  document.querySelector(".watch").addEventListener("click", function (e) {
    if (suppressClick) {
      suppressClick = false;
      return;
    }
    var node = e.target.closest("[data-sel]");
    if (node) {
      e.stopPropagation();
      select(node);
    } else {
      clearSelection();
    }
  });

  document.getElementById("selectChips").addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    var target = findTarget(chip.getAttribute("data-target"));
    if (target) {
      select(target);
      target.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  });

  // ---------- 导出 ----------
  function collect() {
    return {
      screen: { shape: "rect", designWidth: 432, designHeight: 526 },
      video: Object.assign({}, state.video),
      topbar: Object.assign({}, state.topbar),
      tip: Object.assign({}, state.tip),
      refresh: Object.assign({}, state.refresh)
    };
  }

  function changedList() {
    var out = [];
    SCHEMA.forEach(function (group) {
      group.items.forEach(function (item) {
        var val = state[group.key][item.k];
        if (val !== DEFAULTS[group.key][item.k]) {
          out.push({ group: group.title, label: item.label, value: val, def: DEFAULTS[group.key][item.k] });
        }
      });
    });
    return out;
  }

  function buildSummary() {
    var v = state.video;
    var t = state.topbar;
    var tp = state.tip;
    var r = state.refresh;
    var changed = changedList();
    var map = {};
    changed.forEach(function (item) { map[item.group + "/" + item.label] = true; });
    function mark(group, label) { return map[group + "/" + label] ? "（修改）" : ""; }
    function val(group, key) { return state[group][key]; }

    var lines = [];
    lines.push("首页布局调整（矩形屏，designWidth 432，设计尺寸 432×526）：");
    lines.push("【视频卡片】");
    lines.push("- 卡片宽度：" + v.cardWidth + "px" + mark("视频卡片", "卡片宽度") +
      "；封面：" + v.coverW + "×" + v.coverH + "px" + mark("视频卡片", "封面宽度") + mark("视频卡片", "封面高度") +
      "；封面圆角：" + v.coverRadius + "px" + mark("视频卡片", "封面圆角"));
    lines.push("- 卡片圆角：" + v.cardRadius + "px" + mark("视频卡片", "卡片圆角") +
      "；内边距：" + v.cardPadding + "px" + mark("视频卡片", "卡片内边距") +
      "；卡片间距：" + v.cardGap + "px" + mark("视频卡片", "卡片间距"));
    lines.push("- 标题字号：" + v.titleSize + "px" + mark("视频卡片", "标题字号") +
      "；信息字号：" + v.metaSize + "px" + mark("视频卡片", "信息字号"));
    lines.push("- 列表位置：水平偏移 " + v.cardsOffsetX + "px" + mark("视频卡片", "列表水平偏移") +
      "；上间距 " + v.cardsTop + "px" + mark("视频卡片", "列表上间距"));
    lines.push("【顶栏】");
    lines.push("- 胶囊：" + t.pillW + "×" + t.pillH + "px" + mark("顶栏", "胶囊宽度") + mark("顶栏", "胶囊高度") +
      "，圆角 " + t.pillRadius + "px" + mark("顶栏", "胶囊圆角"));
    lines.push("- 胶囊内部：进度环 " + t.ringSize + "px" + mark("顶栏", "进度环尺寸") +
      "、粗细 " + t.ringStroke + "px" + mark("顶栏", "进度环粗细") +
      "；下载图标 " + t.iconSize + "px" + mark("顶栏", "下载图标尺寸") +
      "；百分比字号 " + t.pctSize + "px" + mark("顶栏", "百分比字号") +
      "、宽度 " + t.pctWidth + "px" + mark("顶栏", "百分比宽度") +
      "；内部间距 " + t.pillGap + "px" + mark("顶栏", "内部间距"));
    lines.push("- 标题位置：左边距 " + t.titleLeft + "px" + mark("顶栏", "标题左边距") +
      "；上边距 " + t.topMargin + "px" + mark("顶栏", "标题上边距"));
    lines.push("- 右侧组位置：距右 " + t.topRightRight + "px" + mark("顶栏", "右侧组距右") +
      "；上边距 " + t.rightTop + "px" + mark("顶栏", "右侧组上边距") +
      "；胶囊与时间间距 " + t.clockGap + "px" + mark("顶栏", "胶囊与时间间距"));
    lines.push("- 标题字号：" + t.titleSize + "px" + mark("顶栏", "标题字号") +
      "；时间字号：" + t.timeSize + "px" + mark("顶栏", "时间字号"));
    lines.push("【提示语】");
    lines.push("- 字号：" + tp.tipSize + "px" + mark("提示语", "字号") +
      "；上间距：" + tp.tipMarginTop + "px" + mark("提示语", "上间距") +
      "；水平偏移：" + tp.tipOffsetX + "px" + mark("提示语", "水平偏移"));
    lines.push("【刷新按钮】");
    lines.push("- 尺寸：" + r.refreshW + "×" + r.refreshH + "px" + mark("刷新按钮", "宽度") + mark("刷新按钮", "高度") +
      "；水平位置：" + r.refreshX + "%" + mark("刷新按钮", "水平位置") +
      "；距底部：" + r.refreshBottom + "px" + mark("刷新按钮", "距底部"));
    lines.push("");
    if (changed.length === 0) {
      lines.push("说明：当前全部为默认值，未做调整。");
    } else {
      lines.push("说明：标注“（修改）”的项为相对默认值的改动，其余保持默认。请按以上配置修改首页布局。");
      lines.push("改动项共 " + changed.length + " 个：" + changed.map(function (c) {
        return c.group + "·" + c.label + " " + c.def + "→" + c.value;
      }).join("；"));
    }
    return lines.join("\n");
  }

  function updateExport() {
    var changed = changedList();
    el.changeBadge.textContent = changed.length + " 项修改";
    el.exportText.value = buildSummary();
    syncControls();
  }

  function showToast(text) {
    el.toast.textContent = text;
    el.toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { el.toast.classList.remove("show"); }, 1600);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("已复制");
      }).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast("已复制");
    } catch (e) {
      showToast("复制失败，请手动选择文本");
    }
    document.body.removeChild(ta);
  }

  document.getElementById("copyAi").addEventListener("click", function () {
    copyText(buildSummary());
  });
  document.getElementById("copyJson").addEventListener("click", function () {
    copyText(JSON.stringify(collect(), null, 2));
  });
  document.getElementById("downloadJson").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(collect(), null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "home-layout.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("已下载 home-layout.json");
  });
  document.getElementById("resetAll").addEventListener("click", function () {
    state = JSON.parse(JSON.stringify(DEFAULTS));
    apply();
    updateExport();
    clearSelection();
    showToast("已恢复默认值");
  });

  // 缩放
  document.getElementById("zoomGroup").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-zoom]");
    if (!btn) return;
    currentZoom = Number(btn.getAttribute("data-zoom"));
    el.watchWrap.style.setProperty("--zoom", currentZoom);
    el.watchWrap.style.width = (432 * currentZoom) + "px";
    el.watchWrap.style.height = (526 * currentZoom) + "px";
    document.querySelectorAll("#zoomGroup button").forEach(function (b) {
      b.classList.toggle("active", b === btn);
    });
  });

  // 缓存预览
  el.cacheToggle.addEventListener("change", function () {
    apply();
  });
  el.cachePct.addEventListener("input", function () {
    el.cachePctVal.textContent = el.cachePct.value + "%";
    apply();
  });

  // 初始化
  buildAssets();
  buildCards();
  buildControls();
  apply();
  updateExport();
  syncControls();
  select(el.cards.querySelector(".cover-wrap"));
})();
</script>
</body>
</html>
